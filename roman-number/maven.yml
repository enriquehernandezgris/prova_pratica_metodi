## maven.yml
name: Java CI with Maven
##ogni volta a push or a pull_request is done
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 1.8  ##uses java 1.8
        uses: actions/setup-java@v3
        with:
          java-version: "8.0.412+8"
          distribution: "temurin"
          cache: maven
      - name: Compilazione del progetto ##compiles the proyect
        run: mvn compile

      - name: Test di unitá with JaCoCo ##do the unity tests and generates a report
        run: mvn test jacoco:report

      - name: Analisi statica e Package ## checkstyle for the static analysis
        run: mvn package -DskipTests

      - name: Report to Coveralls cloud ##send the report to coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{secrets.COVERALLS_REPO_TOKEN}}
        run: mvn coveralls:report
